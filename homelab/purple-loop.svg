<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img" aria-label="Each run is scored twice: did I get Domain Admin, and was I caught?" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Each run is scored twice: did I get Domain Admin, and was I caught?</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="312" rx="8" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">Each run is scored twice: did I get Domain Admin, and was I caught?</text>

  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M232 100H264" marker-end="url(#arrow)"/>
    <path d="M472 100H504" marker-end="url(#arrow)"/>
    <path d="M608 144V200" marker-end="url(#arrow)"/>
    <path d="M504 244H232" marker-end="url(#arrow)"/>
    <path d="M128 200V144" marker-end="url(#arrow)"/>
  </g>
  <text x="368" y="234" text-anchor="middle" font-size="11.5" fill="#59636e">findings feed the next round</text>

  <rect x="24" y="56" width="208" height="88" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="128" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">1. Attack from kali01</text>
  <text x="128" y="96" text-anchor="middle" font-size="11.5" fill="#1f2328">Kerberoast, AS-REP roast,</text>
  <text x="128" y="112" text-anchor="middle" font-size="11.5" fill="#1f2328">BloodHound, AD CS (Certipy),</text>
  <text x="128" y="128" text-anchor="middle" font-size="11.5" fill="#1f2328">NTLM relay, own payloads</text>

  <rect x="264" y="56" width="208" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="368" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">2. Telemetry</text>
  <text x="368" y="96" text-anchor="middle" font-size="11.5" fill="#1f2328">Sysmon + Windows event logs</text>
  <text x="368" y="112" text-anchor="middle" font-size="11.5" fill="#1f2328">OPNsense firewall + DNS logs</text>
  <text x="368" y="128" text-anchor="middle" font-size="11.5" fill="#1f2328">Suricata IDS alerts</text>

  <rect x="504" y="56" width="208" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="608" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">3. Elastic SIEM</text>
  <text x="608" y="96" text-anchor="middle" font-size="11.5" fill="#1f2328">prebuilt + custom rules</text>
  <text x="608" y="112" text-anchor="middle" font-size="11.5" fill="#1f2328">EQL sequences, Sigma</text>
  <text x="608" y="128" text-anchor="middle" font-size="11.5" fill="#1f2328">on docker01</text>

  <rect x="504" y="200" width="208" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="608" y="224" text-anchor="middle" font-weight="600" fill="#1f2328">4. Score the run</text>
  <text x="608" y="240" text-anchor="middle" font-size="11.5" fill="#1f2328">compromised? detected?</text>
  <text x="608" y="256" text-anchor="middle" font-size="11.5" fill="#1f2328">which step went unseen,</text>
  <text x="608" y="272" text-anchor="middle" font-size="11.5" fill="#1f2328">and why</text>

  <rect x="24" y="200" width="208" height="88" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="128" y="224" text-anchor="middle" font-weight="600" fill="#1f2328">5. Tune and harden</text>
  <text x="128" y="240" text-anchor="middle" font-size="11.5" fill="#1f2328">write or fix a detection</text>
  <text x="128" y="256" text-anchor="middle" font-size="11.5" fill="#1f2328">raise defense_level</text>
  <text x="128" y="272" text-anchor="middle" font-size="11.5" fill="#1f2328">reset from snapshot</text>
</svg>
