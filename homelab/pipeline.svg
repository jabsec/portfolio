<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" role="img" aria-label="Every VM starts as a template and ends as an Ansible-configured host" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Every VM starts as a template and ends as an Ansible-configured host</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker>
  </defs>
  <rect x="0" y="0" width="760" height="264" rx="8" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">Every VM starts as a template and ends as an Ansible-configured host</text>

  <g fill="none" stroke="#8c959f" stroke-width="1.25">
    <path d="M184 108H208" marker-end="url(#arrow)"/>
    <path d="M368 108H392" marker-end="url(#arrow)"/>
    <path d="M552 108H576" marker-end="url(#arrow)"/>
    <path d="M104 200V160"/><path d="M472 200V160"/><path d="M656 200V160"/>
  </g>

  <rect x="24" y="56" width="160" height="104" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="104" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">Packer</text>
  <text x="104" y="96" text-anchor="middle" font-size="11.5" fill="#1f2328">ISO or cloud image</text>
  <text x="104" y="112" text-anchor="middle" font-size="11.5" fill="#1f2328">+ drivers, updates</text>
  <text x="104" y="128" text-anchor="middle" font-size="11.5" fill="#1f2328">+ cloudbase-init</text>
  <text x="104" y="144" text-anchor="middle" font-size="11.5" fill="#1f2328">generalize, sysprep</text>

  <rect x="208" y="56" width="160" height="104" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="288" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">Template</text>
  <text x="288" y="96" text-anchor="middle" font-size="11.5" fill="#1f2328">software only</text>
  <text x="288" y="112" text-anchor="middle" font-size="11.5" fill="#1f2328">no secrets</text>
  <text x="288" y="128" text-anchor="middle" font-size="11.5" fill="#1f2328">bootstrap account</text>
  <text x="288" y="144" text-anchor="middle" font-size="11.5" fill="#1f2328">with random password</text>

  <rect x="392" y="56" width="160" height="104" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="472" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">Terraform</text>
  <text x="472" y="96" text-anchor="middle" font-size="11.5" fill="#1f2328">full clone per VM</text>
  <text x="472" y="112" text-anchor="middle" font-size="11.5" fill="#1f2328">VLAN tag, static IP</text>
  <text x="472" y="128" text-anchor="middle" font-size="11.5" fill="#1f2328">SSH key via the</text>
  <text x="472" y="144" text-anchor="middle" font-size="11.5" fill="#1f2328">cloud-init drive</text>

  <rect x="576" y="56" width="160" height="104" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
  <text x="656" y="80" text-anchor="middle" font-weight="600" fill="#1f2328">Ansible</text>
  <text x="656" y="96" text-anchor="middle" font-size="11.5" fill="#1f2328">rotate bootstrap</text>
  <text x="656" y="112" text-anchor="middle" font-size="11.5" fill="#1f2328">credential</text>
  <text x="656" y="128" text-anchor="middle" font-size="11.5" fill="#1f2328">apply roles</text>
  <text x="656" y="144" text-anchor="middle" font-size="11.5" fill="#1f2328">(CA, Kali, DC, SIEM)</text>

  <rect x="24" y="200" width="712" height="40" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.25"/>
  <text x="380" y="225" text-anchor="middle" fill="#1f2328">All three run on ansible01: one Git repo, secrets pulled from KeePassXC at run time</text>
</svg>
